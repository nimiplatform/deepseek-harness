build_profile_ref: electron-pnpm
profile_role: developer-workflow-input
test_command: pnpm run test:app
build_command: pnpm run build:electron:windows
output_path: dist-electron-package
lockfile_path: pnpm-lock.yaml
lockfile_policy: author-install-generates-lockfile
ci_install_command: pnpm install --frozen-lockfile
targets:
  macos-aarch64:
    os: macos
    arch: arm64
    build_command: pnpm run build:electron:macos
    payload_path: dist-electron-package
    runtime_entry: payload/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness
  windows-x86_64:
    os: windows
    arch: x86_64
    build_command: pnpm run build:electron:windows
    payload_path: dist-electron-package
    runtime_entry: payload/DeepSeek Harness.exe
